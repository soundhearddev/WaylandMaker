# wmaker-wl configuration file
# Location: ~/.config/wmaker-wl/config.conf
# Format: key=value (one per line, # for comments, empty lines ignored)
# Save and reload with: pkill -HUP wmaker-wl (not implemented yet)

# ============================================================================
# KEYBOARD & LAYOUT
# ============================================================================

# Keyboard layout: qwerty, qwertz, azerty
# Affects key mappings (y↔z for QWERTZ, a↔q for AZERTY)
keyboard_layout=qwerty

# Column width as fraction of screen width (0.1 - 1.0)
# When opening new windows, they get this width
default_column_width_fraction=0.5

# Step for resizing columns with Mod+Minus / Mod+Equal
width_step=0.1

# Minimum column width in pixels (prevents too narrow windows)
min_column_width=200

# Vertical gap between columns and from edges (pixels)
gap=8

# Number of workspaces per output/display
workspace_count=4

# ============================================================================
# WINDOW STYLING
# ============================================================================

# Border width in pixels (0 = no border)
border_width=2

# Border color for focused window (hex: RRGGBB)
border_focused=d8a657

# Border color for unfocused windows (hex: RRGGBB)
border_unfocused=3c3836

# Example colors:
# 0xd8a657 = golden (default)
# 0x3c3836 = dark gray (default)
# 0xff0000 = red
# 0x00ff00 = green
# 0x0000ff = blue
# 0xffffff = white
# 0x000000 = black

# ============================================================================
# INPUT DEVICES
# ============================================================================

# Enable mouse support for window dragging and resizing
enable_mouse_support=true

# Mouse sensitivity multiplier (0.1 - 5.0)
# 1.0 = normal, 2.0 = twice as fast
mouse_sensitivity=1.0

# Enable floating window mode (experimental)
# When true, Alt+F4 or Mod+X toggles floating mode for active window
enable_floating_windows=false

# ============================================================================
# PROGRAMS
# ============================================================================

# Terminal emulator (spawned with Mod+Return)
# Format: command arg1 arg2 ...
terminal=alacritty

# Application launcher (spawned with Mod+D)
# Common launchers: fuzzel, dmenu, wofi
launcher=fuzzel

# Web browser (spawned with custom binding)
# Can be any command
browser=firefox

# ============================================================================
# WINDOWMAKER COMPATIBILITY
# ============================================================================

# Enable WindowMaker feature integration
# Requires WindowMaker development headers (libwmaker-dev)
# Adds support for: themes, docks, window attributes, preferences
enable_wmaker_compat=false

# Directory with WindowMaker dockapps
# Uncomment to enable dockapp scanning and management
# wmaker_docksapp_dir=/home/user/.local/share/dockapps

# ============================================================================
# ADVANCED / EXPERIMENTAL
# ============================================================================

# (None currently, but reserved for future features like:
#  - Custom keybindings in config
#  - Theme selection
#  - Color scheme presets
#  - Animation timings
# )