# Theme "gruvbox": warm, low contrast. This is wmaker-wl's built-in look.
#
# Install:  mkdir -p ~/.config/wmaker-wl/Themes
#           cp gruvbox.conf ~/.config/wmaker-wl/Themes/
# Use:      theme = gruvbox          (in ~/.config/wmaker-wl/config.conf)
#
# A theme sets how things LOOK -- colours, border width, gaps -- and nothing
# else; any other option in a theme file is ignored with a warning, so a
# theme you download can never bind a key or start a program.
border_width     = 2
border_focused   = #d8a657
border_unfocused = #3c3836
border_floating  = #7daea3
gap              = 8
outer_gap        = 8
