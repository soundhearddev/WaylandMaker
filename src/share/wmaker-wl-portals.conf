# xdg-desktop-portal: which backend answers for XDG_CURRENT_DESKTOP=wmaker-wl.
# The wlroots portal does screenshots and screen casting (needs
# xdg-desktop-portal-wlr), the GTK one file choosers, settings, etc.
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
