# wmaker-wl: Dock and Clip contents (template).
#
# Copy to ~/.config/wmaker-wl/dockapps.conf. The Dock keeps its own changes
# (moved, added and removed tiles) in a separate state file, see
# docs/DOCKAPPS.md ("Dock state").
#
#   place     dock (default) or clip
#   position  x,y in tiles; the Dock only looks at y, the Clip at x then y
#   workspace Clip only: 1-based workspace, or "all" (default; omnipresent)

# ---- Dock ------------------------------------------------------------------
[clock]
command = wl-clock --name clock
position = 0,0
autolaunch = yes

[browser]
command = firefox
position = 0,1

[files]
command = xdg-open .
icon = system-file-manager
position = 0,2

# ---- Clip ------------------------------------------------------------------
[terminal]
command = foot
place = clip
position = 0,0

[editor]
command = xdg-open .
icon = accessories-text-editor
place = clip
workspace = 2
position = 1,0
