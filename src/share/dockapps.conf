# DockApp metadata and autolaunch list. Copy to ~/.config/wmaker-wl/dockapps.conf.
#
# This file is OPTIONAL. Most DockApps need none of this: a program that sets
# its own app_id to "dockapp:<name>" or "dockapp-<name>" is recognised
# automatically (see dockapp.zig / docs/DOCKAPPS.md), and "start this at
# session start" is normally just a line in ~/.config/wmaker-wl/autostart,
# exactly like X11 Window Maker. Use this file only when you also want to
# attach metadata the program's app_id cannot carry -- an icon path, a fixed
# dock grid position for a future dock UI -- or when you would rather keep
# the autolaunch list declarative instead of a shell script.
#
# Format: one [name] block per entry, then key = value lines until the next
# [name] or end of file. `command` is the only required key; an entry
# without one is skipped, silently, when the file is parsed. Unknown keys
# are ignored (not an error), so this file can grow across versions without
# breaking older copies of it. `#` starts a comment, same as config.conf.
#
#   [name]                required, block header, free-form label
#   command  = ...         required, split on spaces; "quote" a path that
#                           has spaces in it; for pipes/redirection use
#                           command = /bin/sh -c "..."
#   icon     = /path/to/icon.png   optional, unused until Phase 5 (see
#                           docs/TODO.md) draws an actual dock
#   position = x,y         optional grid position (tiles, not pixels),
#                           also unused until Phase 5; default 0,0
#   autolaunch = yes|no    optional, default no -- start this once when the
#                           session comes up, like an autostart line
#   lowered  = yes|no      optional, default no -- Window Maker's "docked
#                           below normal windows"; stored, no effect yet

[htop]
command = alacritty --class dockapp:htop -e htop
icon = /usr/share/icons/hicolor/48x48/apps/utilities-system-monitor.png
position = 0,1
autolaunch = yes

[clock]
# See the standalone example client at examples/wmaker-dockapp-clock/ --
# it already sets its own app_id to "dockapp:clock", so this block only
# adds a grid position; it needs no `icon =` or app_id override to be
# recognised as a DockApp.
command = wmaker-dockapp-clock
position = 0,0
autolaunch = yes

[volume]
command = alacritty --class dockapp:volume -e pulsemixer
position = 0,2
autolaunch = no