# Contents of the Dock and the Clip, plus DockApp metadata and the autolaunch
# list. Copy to ~/.config/wmaker-wl/dockapps.conf.
#
# This file is OPTIONAL. Without it the Dock is only its logo tile and the
# Clip only the workspace tile; both still work. A program that sets its own
# app_id to "dockapp:<name>" or "dockapp-<name>" is recognised as a DockApp
# automatically (see dockapp.zig / docs/DOCKAPPS.md), and "start this at
# session start" is normally just a line in ~/.config/wmaker-wl/autostart,
# exactly like X11 Window Maker. Use this file to put launchers into the
# Dock and the Clip, to give them icons, or to keep the autolaunch list
# declarative instead of a shell script.
#
# THE DOCK is the column of 64 px tiles on one screen edge (config.conf:
# dock_edge, dock_offset, dock_on_top, dock_reserve_space). Its first tile
# is the logo; every entry with `place = dock` (the default) is a tile below
# it, ordered by the y of `position`. A click starts the program, or focuses
# it if a window of it is open (a small mark in the tile's corner says it
# is); a middle click always starts another one; a right click opens the
# Dock menu.
#
# THE CLIP is the tile with the workspace on it, in a screen corner
# (config.conf: clip_corner, clip_on_top, clip_collapsed). Click its upper
# right arrow for the next workspace, the lower left one for the previous
# (the mouse wheel over it does the same); right click: Clip menu; middle
# click: workspace menu. Entries with `place = clip` appear in a row next to
# it, and only on the workspace named by `workspace` (all of them if that is
# missing). So every workspace can have its own set of launchers, like in
# Window Maker.
#
# Format: one [name] block per entry, then key = value lines until the next
# [name] or end of file. `command` is the only required key; an entry
# without one is skipped, silently, when the file is parsed. Unknown keys
# are ignored (not an error), so this file can grow across versions without
# breaking older copies of it. `#` starts a comment, same as config.conf.
#
#   [name]                required, block header, free-form label; also
#                           what a window with app_id "dockapp:<name>" is
#                           matched against
#   command  = ...         required, split on spaces; "quote" a path that
#                           has spaces in it; for pipes/redirection use
#                           command = /bin/sh -c "..."
#   icon     = name|/path/icon.png   optional. PNG only. A bare name is
#                           searched in /usr/share/icons/hicolor/*/apps and
#                           /usr/share/pixmaps; without `icon` the program's
#                           own name is tried. No icon found: the tile shows
#                           the first letter of the name.
#   position = x,y         optional grid position (tiles, not pixels). In
#                           the Dock only y counts: entries are sorted by it
#                           and stacked without gaps below the logo (which
#                           is y = 0, so entries with y = 0 come right after
#                           it and a negative y puts one above it). In the
#                           Clip they are sorted by x, then y, into a row.
#   place    = dock|clip   optional, default dock
#   workspace = N|all      optional, Clip only: 1-based workspace, default all
#   app_id   = ...         optional: the app_id of the windows this entry
#                           starts, if it cannot be worked out from the name
#                           or the command (see docs/DOCKAPPS.md)
#   autolaunch = yes|no    optional, default no -- start this once when the
#                           session comes up, like an autostart line
#   lowered  = yes|no      optional, default no -- Window Maker's "docked
#                           below normal windows"; stored, no effect (use
#                           dock_on_top / clip_on_top in config.conf)

# ---- the Dock ---------------------------------------------------------------

[clock]
# See the standalone example client at examples/wl-clock/ -- it sets its own
# app_id to "dockapp:clock" (its --name, which must be this entry's name), and
# as it is a fixed 64x64 window it is put right INTO this tile, like a dockapp
# in Window Maker's dock. It draws the whole tile itself, so a docked clock
# looks like the tiles next to it.
command = wl-clock
position = 0,1
autolaunch = yes

# A second clock for another time zone: one more entry, one more --name.
#
# [tokyo]
# command = wl-clock --name tokyo --tz Asia/Tokyo --label tokyo
# position = 0,2
# autolaunch = yes

[htop]
# A terminal is not fixed-size, so it does not sit in the tile: it is an
# ordinary floating window, and this tile starts it or focuses it.
command = alacritty --class dockapp:htop -e htop
icon = utilities-system-monitor
position = 0,2
autolaunch = yes

[volume]
command = alacritty --class dockapp:volume -e pulsemixer
position = 0,3
autolaunch = no

# ---- the Clip ---------------------------------------------------------------

[terminal]
# On every workspace.
command = alacritty
icon = utilities-terminal
place = clip

[notes]
# Only on workspace 2.
command = gedit
place = clip
workspace = 2